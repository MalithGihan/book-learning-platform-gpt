version: 1
applications:
  - appRoot: client
    frontend:
      phases:
        preBuild:
          commands:
            - rm -rf node_modules package-lock.json
            - npm install --no-audit --no-fund
            - npm install --no-save "@rollup/rollup-linux-x64-gnu@$(node -p \"require('rollup/package.json').version\")"
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
