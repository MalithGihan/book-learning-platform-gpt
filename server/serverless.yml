service: book-learning-api

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-south-1
  environment:
    NODE_ENV: production
    CLIENT_ORIGIN: ${env:CLIENT_ORIGIN}
    MONGO_URI: ${env:MONGO_URI}
    JWT_ACCESS_SECRET: ${env:JWT_ACCESS_SECRET}
    JWT_REFRESH_SECRET: ${env:JWT_REFRESH_SECRET}

functions:
  api:
    handler: dist/handler.handler
    events:
      - httpApi: "*"
